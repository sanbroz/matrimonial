# Production stack. Always run through the scripts in ops/ (they pass --env-file .env.production):
#   ./ops/deploy.sh          build, migrate, start / update
#   ./ops/backup-now.sh      take a backup immediately
#   ./ops/restore.sh FILE    restore a backup
name: bureau-crm

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: matri
      POSTGRES_DB: matrimonial
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matri -d matrimonial"]
      interval: 10s
      retries: 10
    # No ports: the database is only reachable from the other containers.

  app:
    build:
      context: .
      target: runner
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
        APP_BUILT_AT: ${APP_BUILT_AT:-}
    image: bureau-crm-app
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://matri:${POSTGRES_PASSWORD}@db:5432/matrimonial?schema=public
      UPDATER_URL: http://updater:8787
      WHATSAPP_URL: http://whatsapp:8788
    volumes:
      - uploads:/data/uploads
    depends_on:
      db: { condition: service_healthy }

  # One-off: database migrations + first-time setup (owner account, dropdown lists)
  tools:
    build: { context: ., target: tools }
    image: bureau-crm-tools
    profiles: ["tools"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://matri:${POSTGRES_PASSWORD}@db:5432/matrimonial?schema=public
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    depends_on:
      db: { condition: service_healthy }

  caddy:
    build: ./ops/caddy
    image: bureau-crm-caddy
    restart: unless-stopped
    # Direct on the internet: 80/443 on all interfaces (Caddy gets HTTPS certificates).
    # Behind Cloudflare Tunnel: HTTP_BIND=127.0.0.1 and one local HTTP_PORT (see DEPLOY.md).
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env.production}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  backup:
    build: ./ops/backup
    image: bureau-crm-backup
    restart: unless-stopped
    env_file: .env.production
    environment:
      TZ: Asia/Kolkata
    volumes:
      - backups:/backups
      - uploads:/data/uploads
    depends_on:
      db: { condition: service_healthy }

  # In-app updates (Settings: owner clicks "Update"). Not published on any port; needs UPDATER_TOKEN.
  # It has the Docker socket so it can rebuild/restart the other containers via ops/deploy.sh.
  updater:
    build: ./ops/updater
    image: bureau-crm-updater
    restart: unless-stopped
    environment:
      # Created by ops/deploy.sh. Optional here so backup/restore scripts work before the first deploy;
      # the updater itself refuses to start without it.
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      # To check WhatsApp reconnects after a library update
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo

  # WhatsApp sender (Baileys). Linked to the bureau number by QR code in Settings → WhatsApp.
  # Not published on any port; needs WHATSAPP_TOKEN (created by ops/deploy.sh).
  whatsapp:
    build:
      context: ./ops/whatsapp
      args:
        # Set by Settings → WhatsApp → Update (stored in .env.production)
        BAILEYS_VERSION: ${BAILEYS_VERSION:-}
    image: bureau-crm-whatsapp
    restart: unless-stopped
    environment:
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
    volumes:
      - whatsapp_auth:/data

volumes:
  pgdata:
  whatsapp_auth:
  uploads:
  backups:
  caddy_data:
  caddy_config:
